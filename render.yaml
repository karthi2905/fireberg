services:
  - type: web
    name: fireberg-platform
    env: node
    plan: free
    buildCommand: npm run install:all && npx --prefix server prisma generate && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: file:./dev.db
